[package]
name = "sethu"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Trace OpenAPI changes into your application, repair them, and prove it."
license = "MIT OR Apache-2.0"
repository = "https://github.com/noemaforge/sethu"

[[bin]]
name = "sethu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_norway = "0.9"
indexmap = { version = "2.14", features = ["serde"] }
sha2 = "0.11"
include_dir = "0.7"
tiny_http = "0.12"
jsonschema = "0.58"
quick-xml = { version = "0.42", features = ["serialize"] }
regex = "1.13"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
